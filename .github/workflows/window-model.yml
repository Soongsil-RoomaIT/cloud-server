name: Window model tests
on:
  push:
    paths: ['model/**', '.github/workflows/window-model.yml']
  pull_request:
    paths: ['model/**', '.github/workflows/window-model.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: model/requirements.txt
      - run: python -m pip install -r model/requirements.txt
      - run: python -m unittest discover -s model/tests -v
